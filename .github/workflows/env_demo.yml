name: Show Env variables

on:
 workflow_dispatch: 


env:
  NAME: Subhashree
  
jobs:
  show_env:
   runs-on: ubuntu-latest
   steps:
     - name: show plain text env
       run: echo "My name is ${{ env.NAME }}"
     - name: Show Secrets
       run: echo "One fun secret is ${{ secrets.DUDU_SECRET }}"
     - name: Show Variables
       run: echo "My Dockerhub Username is ${{ vars.DOCKERHUB_USERNAME }}"
