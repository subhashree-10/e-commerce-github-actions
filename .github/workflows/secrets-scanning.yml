# Goal: To scan the code for tokens, secrets, API keys, or any leaked password so that
# if found we can quickely exposed tokens/keys/etc

# name of the workflow
name: Secrets scan

# Reusable workflow which can be called again whenever needed
on:
    workflow_call:

jobs:
   secret-scan:
       runs-on: ubuntu-latest
       steps:
          - name: Code Checkout
            uses: actions/checkout@v7
            with:
              fetch-depth: 0 # from the very first commit pull all the code

          - name: scan for Leaks
            uses: gitleaks/gitleaks-action@v3
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}